services:
  library:
    build:
      context: .
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      PORT: "5000"
      HOSTNAME: "0.0.0.0"
      LUTRIS_DEMO: "${LUTRIS_DEMO:-0}"
      LUTRIS_IMPORT_FILE: "${LUTRIS_IMPORT_FILE:-/imports/library.json}"
    volumes:
      - library-data:/app/data
      - ./imports:/imports:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/library?pageSize=12').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  library-data:
